                text1: "Garbage Bin",
                text2: "Durable fiber-made garbage bin for daily waste disposal. Lightweight, eco-friendly, and easy to clean—ideal for indoor household trash."
            }
        }
    };

    let currentProduct = "";
    let currentColor = "";

    function openPopup(productId) {
        currentProduct = productId;
        currentColor = "";

        const overlay = document.getElementById("popupOverlay");
        const popupImage = document.getElementById("popupImage");
        const selector = document.getElementById("colorSelector");
        const displayText = document.getElementById("display_text");
        const displayText2 = document.getElementById("display_text2");

        const defaultData = imageMap[productId].default;
        popupImage.src = defaultData.image;
        displayText.innerText = defaultData.text1;
        displayText2.innerText = defaultData.text2 || "";

        selector.innerHTML = "";

        Object.keys(imageMap[productId]).forEach((colorKey) => {
            const swatch = document.createElement("span");
            swatch.className = "color-swatch";
            swatch.style.backgroundColor = colorKey === "default" ? "#ccc" : colorKey;
            swatch.setAttribute("data-color", colorKey);
            swatch.title = colorKey;
            swatch.onclick = () => changeColor(colorKey);
            selector.appendChild(swatch);
        });

        highlightSelectedSwatch(currentColor);
        overlay.style.display = "flex";
    }

    function changeColor(color) {
        const popupImage = document.getElementById("popupImage");
        const displayText = document.getElementById("display_text");
        const displayText2 = document.getElementById("display_text2");

        if (currentProduct && imageMap[currentProduct][color]) {
            const selected = imageMap[currentProduct][color];
            popupImage.src = selected.image;
            displayText.innerText = selected.text1;
            displayText2.innerText = selected.text2 || "";
            currentColor = color;
            highlightSelectedSwatch(color);
        } else {
            console.warn(`No image/text for ${color} in ${currentProduct}`);
        }
    }

    function highlightSelectedSwatch(selectedColor) {
        const swatches = document.querySelectorAll(".color-swatch");
        swatches.forEach((swatch) => {
            const color = swatch.getAttribute("data-color");
            swatch.classList.toggle("selected", color === selectedColor);
        });
    }

    function closePopup() {
        document.getElementById("popupOverlay").style.display = "none";
        currentProduct = "";
    }
</script>
