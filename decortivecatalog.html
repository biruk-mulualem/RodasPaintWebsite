<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f9f9f9;
  }

  /* Grid container for thumbnails */
  .thumb-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 16px;
    justify-items: center;
    padding: 10px 0;
    max-width: 70%;
    margin: 0 auto;
  }

  /* Each thumbnail container fills its grid cell */
  .thumb-container {
    width: 100%;
    text-align: center;
    cursor: pointer;
  }

  .thumbnail {
    width: 100%;
    height: auto;
    border: 1px solid #ccc;
    border-radius: 4px;
    display: block;
    margin: 0 auto;
    transition: transform 0.3s ease;
  }
  .thumbnail:hover {
    transform: scale(1);
  }

  .caption {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    user-select: none;
  }

  /* Modal overlay with transparent background */
  #modalOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: transparent;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  /* Clone image for animation */
  .clone-img {
    position: fixed;
    z-index: 1001;
    transition: all 0.5s ease;
    will-change: transform, width, height, top, left;
    object-fit: fill;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }

  /* Wrapper around modal image & close button */
  #modalWrapper {
    position: relative;
    display: inline-block;
    width: 70vw;
    height: 70vh;
    max-width: 90vw;
    max-height: 90vh;
  }

  /* Modal image */
  #modalImage {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(255,255,255,0.8);
    display: none;
  }

  /* Close button on top-right of modal image */
  #closeBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 28px;
    color: white;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    line-height: 32px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    z-index: 10;
    display: none;
  }
        .button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 50px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      background-color: #154a8f;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      user-select: none;
      margin: 0 5px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn svg {
      fill: white;
      width: 14px;
      height: 14px;
    }

    .btn-left svg {
      margin-right: 8px;
    }

    .btn-right svg {
      margin-left: 8px;
    }

    h1 {
      margin-top: 30px;
      font-size: 28px;
      color: #154a8f;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

  /* Responsive adjustments */
  @media (max-width: 600px) {
    body {
      margin: 12px;
    }
    #modalWrapper {
      width: 80vw;
      height: 80vh;
    }
  }
</style>

<script>
  const thumbnails = document.querySelectorAll('.thumbnail');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalWrapper = document.getElementById('modalWrapper');
  const modalImage = document.getElementById('modalImage');
  const closeBtn = document.getElementById('closeBtn');

  let clone = null;
  let currentThumb = null;

  thumbnails.forEach(thumb => {
    thumb.addEventListener('click', () => openModal(thumb));
    thumb.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openModal(thumb);
      }
    });
  });

  function openModal(thumb) {
    currentThumb = thumb;
    const rect = thumb.getBoundingClientRect();

    clone = thumb.cloneNode(true);
    clone.classList.add('clone-img');
    clone.style.top = rect.top + 'px';
    clone.style.left = rect.left + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';

    document.body.appendChild(clone);
    modalOverlay.style.display = 'flex';

    clone.getBoundingClientRect();

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const maxWidth = vw * 0.7;
    const maxHeight = vh * 0.7;

    const finalWidth = maxWidth;
    const finalHeight = maxHeight;

    const finalTop = (vh - finalHeight) / 2;
    const finalLeft = (vw - finalWidth) / 2;

    requestAnimationFrame(() => {
      clone.style.top = finalTop + 'px';
      clone.style.left = finalLeft + 'px';
      clone.style.width = finalWidth + 'px';
      clone.style.height = finalHeight + 'px';
    });

    clone.addEventListener('transitionend', () => {
      modalImage.src = thumb.dataset.large || thumb.src;
      modalImage.style.display = 'block';
      closeBtn.style.display = 'block';
      clone.style.display = 'none';
      closeBtn.focus();
    }, { once: true });
  }

  function closeModal() {
    modalImage.style.display = 'none';
    closeBtn.style.display = 'none';

    if (!clone || !currentThumb) return;

    clone.style.display = 'block';

    const rect = currentThumb.getBoundingClientRect();

    requestAnimationFrame(() => {
      clone.style.top = rect.top + 'px';
      clone.style.left = rect.left + 'px';
      clone.style.width = rect.width + 'px';
      clone.style.height = rect.height + 'px';
    });

    clone.addEventListener('transitionend', () => {
      modalOverlay.style.display = 'none';
      clone.remove();
      clone = null;
      currentThumb = null;
    }, { once: true });
  }

  closeBtn.addEventListener('click', closeModal);
  closeBtn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      closeModal();
    }
  });

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.style.display === 'flex') {
      closeModal();
    }
  });
</script>

<script>
  // Get URL query parameters
  const params = new URLSearchParams(window.location.search);
  const section = params.get('section');

  // Hide all sections
  document.querySelectorAll('div[id^="section"]').forEach(div => {
    div.style.display = 'none';
  });

  // Show the selected section if it exists
  if (section) {
    const el = document.getElementById('section' + section);
    if (el) {
      el.style.display = 'block';
    }
  }
</script>
